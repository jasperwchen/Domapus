<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>404 - Page Not Found | Domapus</title>

  <!-- GitHub Pages has no server-side rewrite, so every SPA route below
       /Domapus/ (currently /methodology) is served this file. Stash the real
       path, bounce to the app shell, and let the restore script at the TOP of
       index.html put the path back before React Router reads the URL.

       This used to run only when the URL carried a query string or hash, which
       meant a bare /Domapus/methodology — the form in the sitemap, in search
       results, and behind the Legend's "How this works" link — stopped here and
       rendered the 404 body instead of the page. -->
  <script>
    (function () {
      var path = window.location.pathname;
      // public/ is copied verbatim, so this file cannot read the build's base
      // and writes it out instead. The optional pr-preview segment keeps a PR
      // preview's deep links inside that preview rather than bouncing them to
      // production, which serves a different build.
      var matched = path.match(/^\/Domapus\/(?:pr-preview\/pr-\d+\/)?/);
      var base = matched ? matched[0] : '/Domapus/';
      // The app shell exists, so it never lands here; the guard only prevents a
      // hard redirect loop if a deploy ever ships without index.html.
      if (path === base || path === base + 'index.html') return;
      var search = window.location.search;
      var hash   = window.location.hash;
      // Stored RELATIVE to the base ("methodology"), not absolute. index.html
      // re-attaches it to whatever base it was itself served under, so an entry
      // left over from another deployment in the same tab still lands on a route
      // that exists rather than on one the loaded build cannot match.
      //
      // Private-mode storage can throw. Bounce anyway: landing on the map is a
      // worse answer than the requested page but a better one than this body.
      try {
        sessionStorage.setItem('spaPath', path.slice(base.length) + search + hash);
      } catch (err) { /* no restore possible */ }
      window.location.replace(base + search + hash);
    })();
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: #f3f4f6;
      color: #1f2937;
    }
    .container {
      text-align: center;
      padding: 2rem;
      max-width: 480px;
    }
    .code {
      font-size: 6rem;
      font-weight: 800;
      line-height: 1;
      color: #d1d5db;
      margin-bottom: 0.5rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin: 0 0 0.75rem;
    }
    p {
      color: #6b7280;
      margin: 0 0 1.5rem;
      line-height: 1.5;
    }
    a.btn {
      display: inline-block;
      padding: 0.625rem 1.5rem;
      background-color: #3b82f6;
      color: #fff;
      border-radius: 0.375rem;
      text-decoration: none;
      font-weight: 500;
      transition: background-color 0.15s;
    }
    a.btn:hover {
      background-color: #2563eb;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="code">404</div>
    <h1>Page Not Found</h1>
    <p>The page you're looking for doesn't exist or has been moved.</p>
    <a class="btn" href="/Domapus/">Back to Domapus</a>
  </div>
</body>
</html>
