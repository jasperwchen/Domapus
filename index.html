  <!-- Preload what actually gates the first coloured pixel.
       The paint table is ~24 KB against the snapshot's ~2.5 MB, and the two
       fetches below start in the SAME TICK. Chaining them (manifest first, then
       read the hashed filename out of it) would serialise two round trips in
       front of a 24 KB download — ~600 ms of pure latency on slow 4G, which is
       most of the win. The filename map is inlined at build time from the same
       committed manifest the deploy verifies, so a stale inline fails the deploy
       rather than shipping a 404 on the critical path.
       The snapshot is fetched too, but nothing waits for it to paint. -->
  <!-- `crossorigin` is REQUIRED for as="fetch" even same-origin: Chrome matches
       preloads to fetch() in CORS mode, and without it the preload and the fetch
       land in different cache entries and the file downloads TWICE. Measured on
       the bench harness: bytes-before-first-colour went 27,780 -> 55,560 with the
       attribute removed. Do not "tidy" it away.
       Only the manifest is preloaded. The paint table cannot be: its filename is
       metric-dependent and static HTML cannot read ?metric=, so preloading the
       default would waste 100 KB on the critical path for any deep link to a
       different metric. The inline script below runs during head parse and starts
       that fetch itself, which is within a few milliseconds of what the preload
       scanner would have managed. -->
  <link rel="preload" href="%VITE_DATA_BASE%manifest.json" as="fetch" crossorigin />
  <script>
    (function () {
      var base = new URL('%VITE_DATA_BASE%', document.baseURI).href;
      var paint = JSON.parse('%VITE_PAINT_MAP%');
      var metric = new URLSearchParams(location.search).get('metric') || 'zhvi';
      var file = paint[metric] || paint.zhvi;

      // No inlined map means this is a build from before the first pipeline run.
      // Resolve to null rather than fetching `undefined`: the app then reads the
      // manifest itself and pays one extra round trip, which is the correct
      // degradation. Fetching a 404 here would cost the same round trip AND an
      // error in the console.
      // NO `crossorigin` on the preload links above, and a plain fetch here.
      // Both files are same-origin, and the two have to agree on credentials mode
      // or the browser keeps them in separate cache entries and downloads twice —
      // it says so out loud: "preload found, but not used because the request
      // credentials mode does not match". `crossorigin` (i.e. anonymous) means
      // credentials mode SAME-ORIGIN, not omit, which is the trap: the obvious
      // repair of adding `credentials: 'omit'` to the fetch makes it worse.
      window.__domapusBoot = file
        ? Promise.all([
            fetch(base + 'manifest.json').then(function (r) { return r.json(); }),
            fetch(base + file).then(function (r) { return r.arrayBuffer(); })
          ]).then(function (v) {
            return { manifest: v[0], paint: v[1], metric: metric };
          }).catch(function () { return null; })
        : Promise.resolve(null);

      window.__zipDataPromise = fetch(base + 'zip-data.json')
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
        .catch(function () { return null; });
    })();
  </script>
