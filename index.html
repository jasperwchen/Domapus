  <!-- public/404.html stashes the requested SPA path and bounces here. Restore it
       in static HTML, before anything reads the URL: React Router reads location
       once on mount and does not observe history.replaceState. -->
  <script>
    (function () {
      var stored;
      try {
        stored = sessionStorage.getItem('spaPath');
        if (stored) sessionStorage.removeItem('spaPath');
      } catch (err) { return; }
      // Stored base-relative; a leading slash is not ours, so ignore it.
      if (!stored || stored.charAt(0) === '/') return;
      var dir = window.location.pathname.replace(/[^/]*$/, '');
      window.history.replaceState(null, '', dir + stored);
    })();
  </script>

  </script>

  <!-- Manifest and paint table start in the same tick; the paint filename map is
       inlined at build time so the two fetches are not chained.
       `crossorigin` is required on this as="fetch" preload even same-origin, or it
       lands in a different cache entry from fetch() and downloads twice (measured:
       bytes to first colour 27,780 -> 55,560 without it). The paint table is not
       preloaded because its filename depends on ?metric=. -->
  <link rel="preload" href="%VITE_DATA_BASE%manifest.json" as="fetch" crossorigin />
  <script>
    (function () {
      var base = new URL('%VITE_DATA_BASE%', document.baseURI).href;
      var paint = JSON.parse('%VITE_PAINT_MAP%');
      var metric = new URLSearchParams(location.search).get('metric') || 'zhvi';
      // Own keys only: ?metric=__proto__ must not resolve to a prototype.
      var file = Object.prototype.hasOwnProperty.call(paint, metric) ? paint[metric] : paint.zhvi;

      // The methodology page draws no map, so skip the paint table and snapshot.
      // Consumers treat a null boot as "fetch it yourself".
      var mapless = /\/methodology\/?$/.test(location.pathname);

      // No inlined map (a build before the first pipeline run): resolve null.
      window.__domapusBoot = file && !mapless
        ? Promise.all([
            fetch(base + 'manifest.json').then(function (r) { return r.json(); }),
            fetch(base + file).then(function (r) { return r.arrayBuffer(); })
          ]).then(function (v) {
            return { manifest: v[0], paint: v[1], metric: metric };
          }).catch(function () { return null; })
        : Promise.resolve(null);

      window.__zipDataPromise = mapless
        ? Promise.resolve(null)
        : fetch(base + 'zip-data.json')
            .then(function (r) { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
            .catch(function () { return null; });
    })();
  </script>
