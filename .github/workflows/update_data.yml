name: Update ZIP code market Data

permissions:
  contents: write
  issues: write

on:
  schedule:
    - cron: '0 0 26 * *' # Runs at 00:00 UTC on the 26th of every month
  workflow_dispatch:
    inputs:
      override_diff_gate:
        description: Publish even if the diff gate fails. Requires a reason.
        type: boolean
        default: false
      override_reason:
        description: Why. Recorded verbatim in the manifest.
        type: string
        required: false
      force_deploy:
        description: >-
          Run the Deploy job even when the data did not change. This exists so
          the workflow_call wiring can be ACCEPTANCE TESTED on demand — without
          it, the fix for "the data commit never deploys" cannot be verified
          until upstream data happens to change, which is a poor property for
          that particular fix to have. Also useful to redeploy the current data
          after a frontend-only change.
        type: boolean
        default: false
      force_rebuild:
        description: >-
          Rebuild even when the upstream fingerprint is unchanged. Needed after a
          PIPELINE change: S0 exits without downloading when upstream has not
          moved, so a code fix that changes what we compute would otherwise not
          reach the site until Redfin happens to publish.
        type: boolean
        default: false

concurrency:
  group: data-pipeline
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      changed: ${{ steps.check_changes.outputs.changes }}
      sha: ${{ steps.commit.outputs.sha }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version-file: .python-version

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # --only-binary=:all: — see the identical note in ci.yml. A pin without a
        # wheel for the pinned Python must fail immediately, not after four
        # minutes of compiling Arrow C++ into a CMake error.
        pip install --only-binary=:all: -r requirements.txt

    - name: Run Data Update Pipeline
      # Writes build/ only. Nothing in pipeline/ touches public/data/ — the old
      # script opened public/data/zip-data.json at the end of main(), so any run
      # that passed its weak validators overwrote the last known-good published
      # data. That is how the property-type bug shipped for months.
      #
      # The diff gate runs inside this step, BEFORE any artifact is written, so a
      # refused build leaves nothing a later step could mistake for a good one.
      run: |
        ARGS=""
        if [ "${{ inputs.override_diff_gate }}" = "true" ]; then
          ARGS="--override-diff-gate --override-reason ${{ toJSON(inputs.override_reason) }}"
        fi
        if [ "${{ inputs.force_rebuild }}" = "true" ]; then
          ARGS="$ARGS --force"
        fi
        python -u -m pipeline $ARGS

    - name: Did upstream change?
      id: upstream
      # S0 exits 0 without downloading when the upstream fingerprint matches the
      # live manifest. That is a SUCCESS, not a failure — but it writes no
      # build/manifest.json, so every step after this one used to fail on a
      # missing file and the run went red for doing exactly the right thing.
      run: |
        set -euo pipefail
        UNCHANGED=$(jq -r '.unchanged // false' build/s0_probe_report.json 2>/dev/null || echo false)
        echo "unchanged=$UNCHANGED" >> "$GITHUB_OUTPUT"
        if [ "$UNCHANGED" = "true" ]; then
          echo "Upstream fingerprint is unchanged. Nothing was downloaded or built."
          echo "Re-run with force_rebuild if a pipeline change needs to reach the site."
        fi

    - name: Report upstream staleness
      if: steps.upstream.outputs.unchanged != 'true'
      # A WARNING, never a failure. A hard fail refuses to publish, so the
      # manifest carrying the outage banner is never written and the banner can
      # never render — the hard fail and the banner cancel each other out. Stale
      # data is still the best data available; what made the frozen feed
      # dangerous was that it was frozen AND silent.
      run: |
        AGE=$(jq -r '.validation.period_age_days.redfin' build/manifest.json)
        echo "Redfin newest period is $AGE days old."
        if [ "$AGE" -gt 45 ]; then
          echo "::warning::Redfin data is $AGE days old — publishing anyway, with the banner."
        fi

    - name: Publish the verified build
      if: steps.upstream.outputs.unchanged != 'true'
      # Copies into public/data/ only after both gates report ok, so a refused
      # build leaves the last known-good published data untouched. The archive
      # half of phase 2 is no longer blocked — releases exist now, and the next
      # step uploads to them instead of committing.
      run: |
        jq -e '.status == "ok"' build/s4_gate_report.json > /dev/null
        jq -e '.status == "ok"' build/s3_assemble_report.json > /dev/null
        cp build/zip-data.json build/last_updated.json build/manifest.json \
           build/orphans.json public/data/
        # The paint tables are the FIRST-PAINT artifact and they are committed,
        # unlike history. Their filenames carry a content hash, so a data change
        # renames every one of them; replacing the directory wholesale is what
        # makes the stale ones disappear instead of accumulating.
        rm -rf public/data/paint
        cp -r build/paint public/data/paint
        # ~6,100 files, ~121 MB. Gitignored — the next step puts them on the release.
        rm -rf public/data/history
        cp -r build/history public/data/history

    - name: Verify the paint tables the manifest names actually exist
      if: steps.upstream.outputs.unchanged != 'true'
      # `vite.config.ts` inlines `manifest.assets.paint` into index.html at BUILD
      # time so the 24 KB paint fetch starts in the same tick as the manifest
      # fetch. A manifest naming a file that was not published is therefore not a
      # 404 on a background asset — it is a 404 on the critical path, and the map
      # renders grey. Fail here, before the commit, rather than on the live site.
      run: |
        set -euo pipefail
        jq -r '.assets.paint[] | "\(.sha256)  public/data/\(.file)"' \
          public/data/manifest.json > "$RUNNER_TEMP/paint.sha256"
        cat "$RUNNER_TEMP/paint.sha256"
        sha256sum -c "$RUNNER_TEMP/paint.sha256"

    - name: Archive the snapshot to the data release
      if: steps.upstream.outputs.unchanged != 'true'
      # The archive used to be committed as LFS objects, which put 14.45 MiB of
      # data no code path reads behind every checkout (prune-dist.mjs already
      # strips data/archive from dist). Releases hold it now, so this uploads
      # instead of committing.
      #
      # The dedupe check reads the RELEASE, not the working tree. A fresh
      # checkout has no archive/ directory, so the old "newest file on disk"
      # test would see nothing and re-archive on every single run.
      #
      # Unconditional on purpose: it runs even when the data did not change,
      # because the dedupe check makes a repeat a no-op, and a month missed by
      # a failed run can still be filled in later.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        NEW_PERIOD=$(jq -r '.period_end' public/data/last_updated.json)
        # A missing period_end means last_updated.json is malformed, not that
        # the data was unchanged. Failing here lets the "notify" job run.
        if [ "$NEW_PERIOD" == "null" ] || [ -z "$NEW_PERIOD" ]; then
          echo "Error: No period_end found in last_updated.json"
          exit 1
        fi

        TAG="data-${NEW_PERIOD%-*}"           # 2026-07-31 -> data-2026-07
        ASSET="zip-data-$NEW_PERIOD.json.gz"
        echo "Current data period: $NEW_PERIOD -> $TAG/$ASSET"

        if gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null \
             | grep -qx "$ASSET"; then
          echo "Already archived on $TAG. Skipping."
          exit 0
        fi

        gzip -c public/data/zip-data.json > "$ASSET"
        gh release view "$TAG" > /dev/null 2>&1 \
          || gh release create "$TAG" --title "Data ${NEW_PERIOD%-*}" \
               --notes "Monthly ZIP snapshots for the period ending $NEW_PERIOD."
        gh release upload "$TAG" "$ASSET"
        rm -f "$ASSET"

    - name: Archive the history buckets to the data release
      if: steps.upstream.outputs.unchanged != 'true'
      # Same reasoning as the snapshot above, and more so: S8 emits ~6,100 files and
      # ~121 MB every month. One tarball per period; deploy.yml unpacks it back into
      # public/data/history before building.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail
        NEW_PERIOD=$(jq -r '.period_end' public/data/last_updated.json)
        TAG="data-${NEW_PERIOD%-*}"
        ASSET="history-$NEW_PERIOD.tar.gz"

        if gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null \
             | grep -qx "$ASSET"; then
          echo "Already archived on $TAG. Skipping."
          exit 0
        fi

        tar -czf "$ASSET" -C public/data/history .
        ls -l "$ASSET"
        gh release view "$TAG" > /dev/null 2>&1 \
          || gh release create "$TAG" --title "Data ${NEW_PERIOD%-*}" \
               --notes "Monthly ZIP snapshots for the period ending $NEW_PERIOD."
        gh release upload "$TAG" "$ASSET"
        rm -f "$ASSET"

    - name: Check for changes to commit
      if: steps.upstream.outputs.unchanged != 'true'
      id: check_changes
      # The gate is the RELEASE DIGEST, not a count of moved cells. The digest is
      # a sha256 over the snapshot's content columns plus every paint table's own
      # hash, with timestamps excluded, so a rebuild over unchanged upstream data
      # reproduces it exactly and this step correctly says "no".
      #
      # It used to gate on `data_points_changed > 0`. That number was structurally
      # unable to be zero (it counted a `period_end` key with no wire column, so
      # every reporting ZIP was "changed" every run) and, had it ever been fixed
      # naively, a missing baseline returned 0 and would have silently skipped
      # publication. A missing digest therefore means CHANGED here: a redundant
      # deploy is cheap, a skipped one looks exactly like the deploy bug.
      run: |
        set -euo pipefail
        # NOT `.content_changed // true`. jq's `//` treats `false` as empty just
        # like `null`, so the alternative form turns "unchanged" into "publish"
        # and the gate can never say no — which is the bug this step replaces,
        # rebuilt out of a different mistake.
        CHANGED=$(jq -r 'if .content_changed == null then true else .content_changed end'           public/data/last_updated.json)
        echo "change_status  : $(jq -r '.change_status // "?"' public/data/last_updated.json)"
        echo "zips changed   : $(jq -r '.zip_codes_changed // "?"' public/data/last_updated.json)"
        echo "cells changed  : $(jq -r '.data_points_changed // "n/a"' public/data/last_updated.json)"
        echo "content digest : $(jq -r '.content_digest // "?"' public/data/last_updated.json)"
        echo "publishing     : $CHANGED"
        echo "changes=$CHANGED" >> "$GITHUB_OUTPUT"

    - name: Commit and push if changed
      id: commit
      if: steps.upstream.outputs.unchanged != 'true' && steps.check_changes.outputs.changes == 'true'
      run: |
        set -euo pipefail
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        # `-A` on the paint directory so the PREVIOUS release's hashed filenames
        # are staged as deletions. Without it the tree accumulates one dead 100 KB
        # table per metric per month.
        git add public/data/zip-data.json public/data/last_updated.json \
                public/data/manifest.json public/data/orphans.json
        git add -A public/data/paint
        git commit -m "Update market data - $(date +'%Y-%m-%d %H:%M:%S' --utc)"
        git push
        echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload build reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pipeline-reports
        path: build/*_report.json
        if-no-files-found: warn

  # A push made with GITHUB_TOKEN does not trigger workflows, so deploy.yml's
  # `on: push` never fires for the data commit. Calling it here puts a Deploy job
  # in the SAME run graph, which is the whole fix. Verify it appears there — a
  # miswired workflow_call looks identical to the original bug.
  deploy:
    needs: update-data
    if: needs.update-data.outputs.changed == 'true' || inputs.force_deploy
    uses: ./.github/workflows/deploy.yml
    with:
      # Empty when nothing was committed (a forced redeploy of unchanged data).
      # deploy.yml falls back to `github.sha` for exactly that case.
      ref: ${{ needs.update-data.outputs.sha }}
    permissions:
      contents: write

  notify:
    needs: [update-data, deploy]
    if: always() && needs.update-data.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Comment on the standing failure issue, or open one
        # The old version opened a NEW issue on every failed run, so a persistent
        # upstream problem produced one issue per cron tick and the signal was
        # buried in its own duplicates. One issue per failure mode, reopened and
        # commented instead.
        uses: actions/github-script@v9
        with:
          script: |
            const title = 'Market data pipeline failure';
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
                        `/actions/runs/${context.runId}`;
            const body = `Run failed: ${url}\n\nDownload the \`pipeline-reports\` ` +
                         `artifact from that run — each stage writes a report and the ` +
                         `last one with \`status\` other than \`ok\` names the failure.`;

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'all', labels: 'pipeline-failure', per_page: 10,
            });
            const issue = existing.data.find(i => i.title === title);

            if (!issue) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['pipeline-failure'],
              });
              return;
            }
            if (issue.state === 'closed') {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, state: 'open',
              });
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: issue.number, body,
            });
