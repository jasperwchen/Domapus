name: Deploy

# GITHUB_TOKEN pushes do not trigger workflows; data updates call Deploy directly.
on:
  workflow_call:
    inputs:
      ref:
        description: Commit to deploy. Pass the data commit's SHA from the caller.
        type: string
        required: false
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']

permissions:
  contents: write

# deploy.yml and preview.yml both write gh-pages, so they must not race.
# Queue rather than cancel: a cancelled deploy leaves the site on an older build.
concurrency:
  group: gh-pages-write
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          # The caller's event SHA predates its data commit. Deploy the supplied SHA.
          ref: ${{ inputs.ref || github.sha }}

      - name: Report what is being deployed
        env:
          REF_INPUT: ${{ inputs.ref }}
        run: |
          echo "ref input : '$REF_INPUT'"
          echo "deploying : $(git rev-parse HEAD)"
          if [ -f public/data/last_updated.json ]; then
            echo "period_end: $(jq -r '.period_end // "none"' public/data/last_updated.json)"
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - name: Restore and verify the release history
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PERIOD=$(jq -er '.redfin.period_end' public/data/manifest.json)
          TAG="data-${PERIOD%-*}"
          ASSET=$(jq -r '.assets.archives.history.file // empty' public/data/manifest.json)
          SHA=$(jq -r '.assets.archives.history.sha256 // empty' public/data/manifest.json)
          if [ -z "$ASSET" ]; then
            # Compatibility with releases published before immutable archives.
            ASSET="history-$PERIOD.tar.gz"
            if ! gh release download "$TAG" --pattern "$ASSET" --dir "$RUNNER_TEMP"; then
              echo "::warning::Legacy history archive unavailable."
              exit 0
            fi
          else
            gh release download "$TAG" --pattern "$ASSET" --dir "$RUNNER_TEMP"
            echo "$SHA  $RUNNER_TEMP/$ASSET" | sha256sum -c -
          fi
          mkdir -p public/data/history
          tar -xzf "$RUNNER_TEMP/$ASSET" -C public/data/history

      # CI runs beside this job and nothing waits on it; the frontend tests are what stop a
      # class-count mismatch with the published data (a grey map) from shipping.
      - run: npx vitest run

      - run: npm run build

      - name: Guard published size
        run: |
          BYTES=$(du -sb dist | cut -f1)
          LIMIT=$((300 * 1024 * 1024))
          echo "dist/ = $((BYTES / 1048576)) MiB (limit $((LIMIT / 1048576)) MiB)"
          if [ "$BYTES" -gt "$LIMIT" ]; then
            echo "::error::dist/ is $((BYTES / 1048576)) MiB, over the $((LIMIT / 1048576)) MiB guard."
            echo "GitHub Pages hard-fails at 1 GiB for the whole branch. Check what"
            echo "grew, and whether it belongs in public/ (published) or elsewhere."
            exit 1
          fi

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          # Replace gh-pages rather than adding to it: dist/ carries all of public/,
          # so keeping history added another copy per push. This also wipes
          # pr-preview/, which the preview action re-publishes on the next PR push.
          force_orphan: true
